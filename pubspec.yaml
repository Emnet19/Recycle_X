name: recycle_x
description: "Turning Waste Into Value"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

  # State management
  provider: ^6.1.2

  # Networking (ready for Node.js/Express backend)
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Image/